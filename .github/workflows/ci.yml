name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore apps/dotnet-api/ProcurementERP.slnx
      - name: Build
        run: dotnet build apps/dotnet-api/ProcurementERP.slnx --no-restore
      - name: Test
        run: dotnet test apps/dotnet-api/ProcurementERP.slnx --no-build --verbosity normal

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Dependencies
        run: cd apps/web && npm install
      - name: Build
        run: cd apps/web && npm run build
